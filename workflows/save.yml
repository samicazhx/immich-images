name: save-immich-images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  save:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: server
            image: ghcr.io/immich-app/immich-server:v3
          - name: machine-learning
            image: ghcr.io/immich-app/immich-machine-learning:v3
          - name: postgres
            image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull and save
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            docker pull --platform linux/amd64 "${{ matrix.image }}" && break
            echo "pull failed, retry $i"; sleep $((i*20))
          done
          docker image inspect "${{ matrix.image }}" > /dev/null
          docker save "${{ matrix.image }}" | gzip -1 > "${{ matrix.name }}.tar.gz"
          ls -lh "${{ matrix.name }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: immich-${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          compression-level: 0
          retention-days: 3
