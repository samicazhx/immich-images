name: save-immich-images
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: read
env:
  TAG: immich-v3
  GH_REPO: ${{ github.repository }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" --title "Immich images" \
            --notes "Split docker save files. Join the parts and pipe into docker load."
  save:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: server
            image: ghcr.io/immich-app/immich-server:v3
          - name: machine-learning
            image: ghcr.io/immich-app/immich-machine-learning:v3
          - name: postgres
            image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull, save and split
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            docker pull --platform linux/amd64 "${{ matrix.image }}" && break
            echo "pull failed, retry $i"; sleep $((i*20))
          done
          docker image inspect "${{ matrix.image }}" > /dev/null
          docker save "${{ matrix.image }}" | gzip -1 | split -b 1500M -d -a 2 - "immich-${{ matrix.name }}.tar.gz.part-"
          sha256sum immich-${{ matrix.name }}.tar.gz.part-* > "immich-${{ matrix.name }}.sha256"
          ls -lh immich-${{ matrix.name }}.*
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" immich-${{ matrix.name }}.tar.gz.part-* "immich-${{ matrix.name }}.sha256" --clobber
